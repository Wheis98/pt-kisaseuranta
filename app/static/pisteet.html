<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kipa — Pisteet</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    .tehtava-card { background:var(--card); border:1.5px solid var(--border); border-radius:10px; padding:14px 16px; margin-bottom:8px; }
    .tehtava-header { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:10px; }
    .tehtava-nimi { font-weight:700; font-size:.97rem; }
    .tyyppi-badge { font-size:.72rem; font-weight:700; padding:2px 8px; border-radius:12px; flex-shrink:0; }
    .tyyppi-pisteet { background:#ede9fe; color:#5b21b6; }
    .tyyppi-oikein_vaarin { background:#dcfce7; color:#166534; }
    .tyyppi-ajanotto { background:#dbeafe; color:#1e40af; }
    .tyyppi-kaava { background:#fef3c7; color:#92400e; }
    .syote-input-row { display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-bottom:4px; }
    .syote-label { font-size:.82rem; color:var(--muted); min-width:70px; }
    .oikein-group { display:flex; gap:8px; }
    .oikein-btn { flex:1; padding:9px; border:2px solid var(--border); border-radius:8px; background:white; font-weight:600; cursor:pointer; font-size:.9rem; transition:all .12s; }
    .oikein-btn.sel-ok { border-color:var(--success); background:#dcfce7; color:#166534; }
    .oikein-btn.sel-no { border-color:var(--danger); background:#fee2e2; color:#991b1b; }
    .score-row { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
    .score-row input { padding:8px 10px; border:1.5px solid var(--border); border-radius:6px; font-size:.95rem; }
    .score-row .score-input { width:90px; }
    .score-row .aika-input { width:64px; }
    .max-hint { font-size:.8rem; color:var(--muted); }
    .osatehtava-block { border-left:3px solid var(--border); padding:8px 0 6px 14px; margin:8px 0 4px; }
    .osa-header { display:flex; align-items:center; gap:8px; margin-bottom:8px; font-size:.9rem; }
    .osa-nimi { font-weight:600; flex:1; }
    .parent-total { font-size:.82rem; color:var(--muted); margin-top:8px; padding-top:6px; border-top:1px solid var(--border); text-align:right; }
    textarea { width:100%; padding:10px 12px; border:1.5px solid var(--border); border-radius:8px; font-size:.9rem; resize:vertical; font-family:inherit; }
    .kriteerit { font-size:.8rem; color:var(--muted); white-space:pre-wrap; background:#f8fafc; border-radius:6px; padding:6px 9px; margin:-4px 0 8px; line-height:1.45; }
    .vaihtoehdot { display:flex; flex-direction:column; gap:5px; width:100%; }
    .vaihtoehto { display:flex; align-items:flex-start; gap:9px; text-align:left; padding:8px 10px; border:2px solid var(--border); border-radius:8px; background:white; cursor:pointer; font-size:.85rem; line-height:1.35; transition:all .12s; }
    .vaihtoehto .vo-ruutu { font-size:1.05rem; line-height:1; flex-shrink:0; }
    .vaihtoehto .vo-p { font-weight:700; min-width:44px; flex-shrink:0; }
    .vaihtoehto.valittu { border-color:var(--success); background:#dcfce7; color:#166534; }
    textarea:focus { outline:none; border-color:var(--primary); box-shadow:0 0 0 3px rgba(99,102,241,.12); }
  </style>
</head>
<body>
<div class="header">
  <div class="header-left">
    <span class="header-title" id="otsikko">Pisteet</span>
    <span class="header-sub" id="vartio-info"></span>
  </div>
  <div class="header-right">
    <button class="btn btn-white btn-sm" onclick="takaisin()">← Takaisin</button>
  </div>
</div>

<div class="container">
  <div id="lataus" class="msg msg-ok" style="display:flex;margin-top:24px">Ladataan...</div>
  <div id="tehtavat-lista" style="margin-top:16px;display:none"></div>

  <div class="card" id="kommentti-osio" style="display:none">
    <div class="card-title">Kommentti rastilta (valinnainen)</div>
    <textarea id="kommentti" rows="2" placeholder="Vapaamuotoinen huomio..."></textarea>
  </div>

  <div id="virhe" class="msg msg-error" style="display:none;margin-top:8px"></div>
  <button class="btn btn-success btn-block" id="tallenna-btn" style="display:none" onclick="tallenna()">Tallenna pisteet</button>
  <div id="ok-viesti" class="msg msg-ok" style="display:none;margin-top:8px">Pisteet tallennettu!</div>
</div>

<script>
const params = new URLSearchParams(location.search);
// Admin-tila (?admin=1): tulosten muokkaus tulokset-sivulta admin-tokenilla, ei rastihenkilön kirjautumista
const adminMode = params.get("admin") === "1";
const adminToken = localStorage.getItem("admin_token");
const token = adminMode ? "" : localStorage.getItem("token");
const rastinumero = localStorage.getItem("rastinumero");
const rastiId = parseInt(params.get("rasti_id"));
const vartio = params.get("vartio") || "";
if (adminMode ? !adminToken : !token) { window.location.href = adminMode ? "/admin.html" : "/leimaus.html"; }
else if (!rastiId || !vartio) { window.location.href = adminMode ? "/tulokset.html" : "/leimaus.html"; }
const adminOtsikot = adminMode ? { "x-admin-token": adminToken } : {};

document.getElementById("vartio-info").textContent = vartio + (adminMode ? " · admin" : "");

let suoritusId = null;
let tehtavat = [];

function takaisin() { window.location.href = adminMode ? "tulokset.html" : "leimaus.html"; }

// Aika syötetään kahteen kenttään: minuutit (<id>-m) ja sekunnit (<id>-s). Tyhjä kenttä = 0, molemmat tyhjiä = ei aikaa.
function aikaKentista(idPohja) {
  const m = document.getElementById(idPohja + "-m")?.value.trim() ?? "";
  const s = document.getElementById(idPohja + "-s")?.value.trim() ?? "";
  if (m === "" && s === "") return null;
  const mm = m === "" ? 0 : parseInt(m), ss = s === "" ? 0 : parseInt(s);
  return isNaN(mm) || isNaN(ss) ? null : mm * 60 + ss;
}
function aikaMinSek(sekunnit) {
  if (sekunnit === null || sekunnit === undefined || sekunnit === "") return { m: "", s: "" };
  const kok = Math.round(sekunnit);
  return { m: Math.floor(kok / 60), s: kok % 60 };
}
// Kaava-tehtävän aika-syöte on kellonaika hh:mm:ss (<input type="time">), tallennetaan sekunteina vuorokauden alusta
function sekKelloksi(sekunnit) {
  if (sekunnit === null || sekunnit === undefined || sekunnit === "") return "";
  const k = Math.round(sekunnit) % 86400, p = n => String(n).padStart(2, "0");
  return `${p(Math.floor(k / 3600))}:${p(Math.floor(k / 60) % 60)}:${p(k % 60)}`;
}
function kelloKentasta(id) {
  const v = document.getElementById(id)?.value || "";
  if (!v) return null;
  const [h, m, s] = v.split(":").map(Number);
  return h * 3600 + m * 60 + (s || 0);
}

// Leimaussivun ajastin tälle vartiolle palvelimelta: {alku_sek, loppu_sek, kesto, kaynnissa} tai null
let ajastin = null;
async function haeAjastin() {
  try {
    const res = await fetch(`/api/ajastimet?rasti_id=${rastiId}&vartio=${encodeURIComponent(vartio)}`);
    ajastin = res.ok ? ((await res.json())[0] || null) : null;
  } catch (e) { ajastin = null; }
  return ajastin;
}
// Ajastimen arvot aika-syötteille: yksi syöte = kesto, muuten ensimmäinen = aloitusaika ja viimeinen = lopetusaika
// (käynnissä olevalle lopetusaika = aloitus + tähänastinen kesto)
function ajastimenArvot(aikaSyotteet, a) {
  if (!a || !aikaSyotteet.length) return {};
  if (aikaSyotteet.length === 1) return { [aikaSyotteet[0].nimi]: a.kesto };
  return {
    [aikaSyotteet[0].nimi]: a.alku_sek,
    [aikaSyotteet[aikaSyotteet.length - 1].nimi]: a.loppu_sek ?? (a.alku_sek + a.kesto) % 86400,
  };
}
// ⏱-nappi: hakee ajastimen tuoreena palvelimelta ja täyttää aika-syötteet
async function taytaAjastimesta(prefix, id) {
  const item = prefix === 't' ? tehtavat.find(t => t.id === id) : tehtavat.flatMap(t => t.osatehtavat || []).find(o => o.id === id);
  const a = await haeAjastin();
  if (!a) { alert("Tälle vartiolle ei ole käynnistetty ajastinta."); return; }
  const arvot = ajastimenArvot((item.syotteet || []).filter(s => s.tyyppi === 'aika'), a);
  Object.entries(arvot).forEach(([nimi, sek]) => {
    document.getElementById(`${prefix}-syote-${id}-${nimi}`).value = sekKelloksi(sek);
  });
}

function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function kriteeritHTML(ohje) { return ohje ? `<div class="kriteerit">${esc(ohje)}</div>` : ""; }

// Arvostelun vaihtoehdot valintoina: valittu pistemäärä menee piilokenttään inputId (luetaan kuten numerokenttä)
// naytaPisteet=false: pelkkä valintaruutu (esim. kaavan hylätty-merkintä), jonka arvo ei ole pisteitä
function vaihtoehdotHTML(inputId, vaihtoehdot, arvo, prefix, id, naytaPisteet = true) {
  const nyk = arvo === "" || arvo == null ? null : Number(arvo);
  const valittuIdx = vaihtoehdot.findIndex(v => v.pisteet === nyk);
  return `<div class="vaihtoehdot">
    ${vaihtoehdot.map((v, i) => `<button type="button" class="vaihtoehto ${i === valittuIdx ? 'valittu' : ''}" data-pisteet="${v.pisteet}"
        onclick="valitseVaihtoehto(this,'${inputId}','${prefix}',${id})">
      <span class="vo-ruutu">${i === valittuIdx ? '☑' : '☐'}</span>${naytaPisteet ? `<span class="vo-p">${String(v.pisteet).replace('.', ',')} p</span>` : ''}<span>${esc(v.kuvaus)}</span>
    </button>`).join("")}
    <input type="hidden" id="${inputId}" value="${nyk ?? ''}">
  </div>`;
}
function valitseVaihtoehto(btn, inputId, prefix, id) {
  const ryhma = btn.parentElement, oli = btn.classList.contains('valittu');
  ryhma.querySelectorAll('.vaihtoehto').forEach(b => { b.classList.remove('valittu'); b.querySelector('.vo-ruutu').textContent = '☐'; });
  if (!oli) { btn.classList.add('valittu'); btn.querySelector('.vo-ruutu').textContent = '☑'; }
  document.getElementById(inputId).value = oli ? '' : btn.dataset.pisteet;  // uusi painallus poistaa valinnan
  updateParentTotal(id, prefix);
}

function tyyppiClass(t) { return 'tyyppi-badge tyyppi-'+t; }
function tyyppiLabel(t) { return {pisteet:'Pisteet',oikein_vaarin:'Oikein/Väärin',ajanotto:'Ajanotto',kaava:'Kaava'}[t]||t; }

function oikeinBtn(id, prefix, existingOikein) {
  const isO = existingOikein === 1, isV = existingOikein === 0;
  return `<div class="oikein-group">
    <button class="oikein-btn ${isO?'sel-ok':''}" id="${prefix}-ok-${id}" onclick="togOikein('${prefix}',${id},1)">✓ Oikein</button>
    <button class="oikein-btn ${isV?'sel-no':''}" id="${prefix}-no-${id}" onclick="togOikein('${prefix}',${id},0)">✗ Väärin</button>
  </div>`;
}

function togOikein(prefix, id, arvo) {
  const o = document.getElementById(`${prefix}-ok-${id}`);
  const v = document.getElementById(`${prefix}-no-${id}`);
  if (!o||!v) return;
  const wasSelected = (arvo===1 && o.classList.contains('sel-ok')) || (arvo===0 && v.classList.contains('sel-no'));
  o.classList.remove('sel-ok','sel-no'); v.classList.remove('sel-ok','sel-no');
  if (!wasSelected) { if(arvo===1) o.classList.add('sel-ok'); else v.classList.add('sel-no'); }
  updateParentTotal(id, prefix);
}

function updateParentTotal(id, prefix) {
  // If this is an osatehtava, update parent total
  if (prefix !== 'o') return;
  tehtavat.forEach(t => {
    if (t.osatehtavat && t.osatehtavat.some(o => o.id === id)) {
      recomputeParentTotal(t);
    }
  });
}

function recomputeParentTotal(t) {
  const el = document.getElementById(`parent-total-${t.id}`);
  if (!el) return;
  if (t.tyyppi === 'kaava') { el.textContent = 'Yhteensä: lasketaan tehtävän kaavalla tuloksissa'; return; }
  let sum = 0, max = 0, hasAny = false;
  t.osatehtavat.forEach(o => {
    const score = getOsaScore(o);
    if (score.pisteet !== null) { sum += score.pisteet; hasAny = true; }
    if (o.max_pisteet !== null) max += o.max_pisteet;
  });
  el.textContent = hasAny ? `Yhteensä: ${sum} p${max>0?' / '+max+' p':''}` : 'Yhteensä: —';
}

// Kaava-tyypin syötekentistä koostettu {nimi: arvo} tai null jos mitään ei ole täytetty
function getSyoteArvot(item, prefix) {
  const arvot = {};
  let mikaanTaytetty = false;
  (item.syotteet || []).forEach(s => {
    const inputId = `${prefix}-syote-${item.id}-${s.nimi}`;
    if (s.tyyppi === 'aika') {
      const sekunnit = kelloKentasta(inputId);
      if (sekunnit !== null) { arvot[s.nimi] = sekunnit; mikaanTaytetty = true; }
    } else {
      const v = parseFloat(document.getElementById(inputId)?.value);
      if (!isNaN(v)) { arvot[s.nimi] = v; mikaanTaytetty = true; }
    }
  });
  return mikaanTaytetty ? arvot : null;
}

function getTehtavaScore(t) {
  if (t.tyyppi === 'pisteet') {
    const v = parseFloat(document.getElementById(`t-${t.id}`)?.value); return { pisteet: isNaN(v)?null:v, oikein:null, aika_sekuntia:null, syotteet:null };
  } else if (t.tyyppi === 'oikein_vaarin') {
    const o=document.getElementById(`t-ok-${t.id}`),v=document.getElementById(`t-no-${t.id}`);
    const oikein=o?.classList.contains('sel-ok')?1:v?.classList.contains('sel-no')?0:null;
    return { pisteet: oikein!==null?(oikein?(t.max_pisteet??1):0):null, oikein, aika_sekuntia:null, syotteet:null };
  } else if (t.tyyppi === 'kaava') {
    return { pisteet:null, oikein:null, aika_sekuntia:null, syotteet: getSyoteArvot(t, 't') };
  } else {
    const aika=aikaKentista(`t-aika-${t.id}`);
    const pv=parseFloat(document.getElementById(`t-p-${t.id}`)?.value);
    return { pisteet: isNaN(pv)?null:pv, oikein:null, aika_sekuntia:aika, syotteet:null };
  }
}

function getOsaScore(o) {
  if (o.tyyppi === 'pisteet') {
    const v=parseFloat(document.getElementById(`o-${o.id}`)?.value); return { pisteet: isNaN(v)?null:v, oikein:null, aika_sekuntia:null, syotteet:null };
  } else if (o.tyyppi === 'oikein_vaarin') {
    const ob=document.getElementById(`o-ok-${o.id}`),vb=document.getElementById(`o-no-${o.id}`);
    const oikein=ob?.classList.contains('sel-ok')?1:vb?.classList.contains('sel-no')?0:null;
    return { pisteet: oikein!==null?(oikein?(o.max_pisteet??1):0):null, oikein, aika_sekuntia:null, syotteet:null };
  } else if (o.tyyppi === 'kaava') {
    return { pisteet:null, oikein:null, aika_sekuntia:null, syotteet: getSyoteArvot(o, 'o') };
  } else {
    const aika=aikaKentista(`o-aika-${o.id}`);
    const pv=parseFloat(document.getElementById(`o-p-${o.id}`)?.value);
    return { pisteet: isNaN(pv)?null:pv, oikein:null, aika_sekuntia:aika, syotteet:null };
  }
}

// ajastin (palvelimelta) täyttää ajat valmiiksi — kaava-tehtävässä vain tehtävätasolla (esitayta), ajanotossa aina.
// Kaava-tehtävän aika-syötteen vieressä ⏱-nappi hakee ajat ajastimelta myös osatehtäviin.
function renderScore(tyyppi, id, prefix, existing, max, timerSek, syotteet, existingSyotteet, esitayta, vaihtoehdot) {
  if (tyyppi === 'kaava') {
    existingSyotteet = existingSyotteet || {};
    if (!syotteet || !syotteet.length) return '<span class="max-hint">Tälle tehtävälle ei ole määritelty syötteitä.</span>';
    // Esitäyttö tehdään vain jos kaikki aika-syötteet ovat vielä tyhjiä
    const aikaSyotteet = syotteet.filter(s => s.tyyppi === 'aika');
    const esitaytto = esitayta && aikaSyotteet.every(s => existingSyotteet[s.nimi] == null) ? ajastimenArvot(aikaSyotteet, ajastin) : {};
    const viimeinen = aikaSyotteet[aikaSyotteet.length - 1];
    return syotteet.map(s => {
      const inputId = `${prefix}-syote-${id}-${s.nimi}`;
      if (s.tyyppi === 'aika') {
        return `<div class="syote-input-row">
          <span class="syote-label">${s.kuvaus || s.nimi}</span>
          <input type="time" step="1" class="score-input" style="width:auto" id="${inputId}" value="${sekKelloksi(existingSyotteet[s.nimi] ?? esitaytto[s.nimi])}">
          ${s === viimeinen ? `<button type="button" class="btn btn-ghost btn-xs" title="Hae aloitus- ja lopetusaika ajastimelta" onclick="taytaAjastimesta('${prefix}', ${id})">⏱</button>` : ''}
        </div>`;
      }
      const v = existingSyotteet[s.nimi] ?? "";
      if (s.vaihtoehdot && s.vaihtoehdot.length) {
        return `<div class="syote-input-row" style="margin-bottom:8px">
          <span class="syote-label" style="width:100%">${esc(s.kuvaus || s.nimi)}</span>
          ${vaihtoehdotHTML(inputId, s.vaihtoehdot, v, prefix, id, s.vaihtoehdot.length > 1)}
        </div>`;
      }
      return `<div class="syote-input-row">
        <span class="syote-label">${s.kuvaus || s.nimi}</span>
        <input type="number" class="score-input" id="${inputId}" value="${v}" placeholder="${s.nimi}" step="0.01">
      </div>`;
    }).join("");
  } else if (tyyppi === 'pisteet' && vaihtoehdot && vaihtoehdot.length) {
    return vaihtoehdotHTML(`${prefix}-${id}`, vaihtoehdot, existing?.pisteet ?? "", prefix, id);
  } else if (tyyppi === 'pisteet') {
    const val = existing?.pisteet ?? "";
    return `<div class="score-row">
      <input type="number" class="score-input" id="${prefix}-${id}" value="${val}" placeholder="p" step="0.5" min="0" ${max!==null?`max="${max}"`:''}
        oninput="updateParentTotal(${id},'${prefix}')">
      ${max!==null?`<span class="max-hint">/ ${max} p</span>`:'<span class="max-hint">pisteitä</span>'}
    </div>`;
  } else if (tyyppi === 'oikein_vaarin') {
    return oikeinBtn(id, prefix, existing?.oikein ?? null);
  } else {
    const aikaVal = aikaMinSek(existing?.aika_sekuntia != null ? existing.aika_sekuntia : (timerSek || null));
    const pVal = existing?.pisteet ?? "";
    return `<div class="score-row">
      <input type="number" class="aika-input" id="${prefix}-aika-${id}-m" value="${aikaVal.m}" placeholder="min" min="0" step="1"
        oninput="updateParentTotal(${id},'${prefix}')">
      <span class="max-hint">min</span>
      <input type="number" class="aika-input" id="${prefix}-aika-${id}-s" value="${aikaVal.s}" placeholder="sek" min="0" max="59" step="1"
        oninput="updateParentTotal(${id},'${prefix}')">
      <span class="max-hint">sek</span>
      <input type="number" class="score-input" id="${prefix}-p-${id}" value="${pVal}" placeholder="p" step="0.5" min="0"
        style="width:70px" oninput="updateParentTotal(${id},'${prefix}')">
      <span class="max-hint">${max!==null?'/ '+max+' p':'p'}</span>
    </div>`;
  }
}

function renderTehtavat(tehtavat, suoritus) {
  const lista = document.getElementById("tehtavat-lista");
  lista.innerHTML = "";
  const timerSek = ajastin ? ajastin.kesto : null;

  tehtavat.forEach(t => {
    const hasOsa = t.osatehtavat && t.osatehtavat.length > 0;
    const existingT = suoritus.tehtava_tulokset.find(x => x.tehtava_id === t.id);

    let scoreHTML = "";
    if (!hasOsa) {
      scoreHTML = renderScore(t.tyyppi, t.id, 't', existingT, t.max_pisteet, timerSek, t.syotteet, suoritus.syotteet?.[`tehtava:${t.id}`], true, t.vaihtoehdot);
    }

    let osaHTML = "";
    if (hasOsa) {
      osaHTML = t.osatehtavat.map(o => {
        const existingO = suoritus.osatehtava_tulokset.find(x => x.osatehtava_id === o.id);
        return `<div class="osatehtava-block">
          <div class="osa-header">
            <span class="osa-nimi">${o.nimi}</span>
            <span class="${tyyppiClass(o.tyyppi)}">${tyyppiLabel(o.tyyppi)}</span>
          </div>
          ${kriteeritHTML(o.ohje)}
          ${renderScore(o.tyyppi, o.id, 'o', existingO, o.max_pisteet, null, o.syotteet, suoritus.syotteet?.[`osatehtava:${o.id}`], false, o.vaihtoehdot)}
        </div>`;
      }).join("");
      osaHTML += `<div class="parent-total" id="parent-total-${t.id}">Yhteensä: —</div>`;
    }

    const card = document.createElement("div");
    card.className = "tehtava-card";
    card.innerHTML = `
      <div class="tehtava-header">
        <span class="tehtava-nimi">${t.nimi}</span>
        <span class="${tyyppiClass(t.tyyppi)}">${tyyppiLabel(t.tyyppi)}</span>
      </div>
      ${kriteeritHTML(t.ohje)}
      ${scoreHTML}${osaHTML}
    `;
    lista.appendChild(card);
  });

  // Compute initial parent totals
  tehtavat.forEach(t => { if(t.osatehtavat?.length) recomputeParentTotal(t); });
}

// Tarkistaa ettei mikään pistekenttä ylitä tehtävän maksimia eikä ole negatiivinen.
// Merkitsee virheelliset kentät punaisella ja palauttaa virheiden tekstit.
function tarkistaRajat() {
  const virheet = [];
  let ensimmainen = null;
  const tarkista = (inputId, nimi, max) => {
    const el = document.getElementById(inputId);
    if (!el) return;
    el.style.borderColor = "";
    const v = parseFloat(el.value);
    if (isNaN(v)) return;
    if (v < 0 || (max !== null && max !== undefined && v > max)) {
      el.style.borderColor = "var(--danger, #dc2626)";
      virheet.push(v < 0 ? `${nimi}: pisteet eivät voi olla negatiivisia` : `${nimi}: ${v} ylittää maksimin ${max} p`);
      if (!ensimmainen) ensimmainen = el;
    }
  };
  const tarkistaAika = (idPohja, nimi) => {
    const m = document.getElementById(idPohja + "-m"), s = document.getElementById(idPohja + "-s");
    if (!m || !s) return;
    m.style.borderColor = s.style.borderColor = "";
    const mv = parseInt(m.value), sv = parseInt(s.value);
    const vaara = (m.value.trim() !== "" && (isNaN(mv) || mv < 0)) || (s.value.trim() !== "" && (isNaN(sv) || sv < 0 || sv > 59));
    if (vaara) {
      const el = (s.value.trim() !== "" && (isNaN(sv) || sv < 0 || sv > 59)) ? s : m;
      el.style.borderColor = "var(--danger, #dc2626)";
      virheet.push(`${nimi}: aika virheellinen (sekunnit 0–59)`);
      if (!ensimmainen) ensimmainen = el;
    }
  };
  const tarkistaSyotteet = (item, prefix, nimi) => {
    (item.syotteet || []).forEach(s => {
      const inputId = `${prefix}-syote-${item.id}-${s.nimi}`;
      if (s.tyyppi !== 'aika') tarkista(inputId, `${nimi} / ${s.kuvaus || s.nimi}`, null);  // kellonajan tarkistaa selain
    });
  };
  for (const t of tehtavat) {
    if (t.osatehtavat && t.osatehtavat.length > 0) {
      for (const o of t.osatehtavat) {
        if (o.tyyppi === 'ajanotto') tarkistaAika(`o-aika-${o.id}`, `${t.nimi} / ${o.nimi}`);
        if (o.tyyppi === 'pisteet') tarkista(`o-${o.id}`, `${t.nimi} / ${o.nimi}`, o.max_pisteet);
        else if (o.tyyppi === 'ajanotto') tarkista(`o-p-${o.id}`, `${t.nimi} / ${o.nimi}`, o.max_pisteet);
        else if (o.tyyppi === 'kaava') tarkistaSyotteet(o, 'o', `${t.nimi} / ${o.nimi}`);
      }
    } else if (t.tyyppi === 'pisteet') tarkista(`t-${t.id}`, t.nimi, t.max_pisteet);
    else if (t.tyyppi === 'ajanotto') { tarkistaAika(`t-aika-${t.id}`, t.nimi); tarkista(`t-p-${t.id}`, t.nimi, t.max_pisteet); }
    else if (t.tyyppi === 'kaava') tarkistaSyotteet(t, 't', t.nimi);
  }
  if (ensimmainen) ensimmainen.focus();
  return virheet;
}

// Kaava-tehtävien alku- ja loppuajat (ensimmäinen ja viimeinen aika-syöte) varmistusta varten.
// Palauttaa {rivit, virheet}: loppuaika ennen alkuaikaa on virhe, ellei tehtävälle ole sallittu keskiyön ylitystä.
function tarkistaAikaparit() {
  const rivit = [], virheet = [];
  const kasittele = (item, prefix, nimi) => {
    const ajat = (item.syotteet || []).filter(s => s.tyyppi === 'aika');
    if (ajat.length < 2) return;
    const alkuEl = document.getElementById(`${prefix}-syote-${item.id}-${ajat[0].nimi}`);
    const loppuEl = document.getElementById(`${prefix}-syote-${item.id}-${ajat[ajat.length - 1].nimi}`);
    alkuEl.style.borderColor = loppuEl.style.borderColor = "";
    const alku = kelloKentasta(alkuEl.id), loppu = kelloKentasta(loppuEl.id);
    if (alku === null || loppu === null) return;
    const yliKeskiyon = loppu < alku;
    if (yliKeskiyon && !item.keskiyo) {
      alkuEl.style.borderColor = loppuEl.style.borderColor = "var(--danger, #dc2626)";
      virheet.push(`${nimi}: loppuaika (${ajat[ajat.length - 1].kuvaus || ajat[ajat.length - 1].nimi} ${sekKelloksi(loppu)}) on ennen alkuaikaa (${ajat[0].kuvaus || ajat[0].nimi} ${sekKelloksi(alku)})`);
      return;
    }
    const kesto = yliKeskiyon ? loppu + 86400 - alku : loppu - alku;
    rivit.push(`${nimi}\n   ${ajat[0].kuvaus || ajat[0].nimi}: ${sekKelloksi(alku)}\n   ${ajat[ajat.length - 1].kuvaus || ajat[ajat.length - 1].nimi}: ${sekKelloksi(loppu)}${yliKeskiyon ? " (seuraavana päivänä)" : ""}\n   Kesto: ${sekKelloksi(kesto)}`);
  };
  for (const t of tehtavat) {
    if (t.osatehtavat && t.osatehtavat.length) {
      t.osatehtavat.forEach(o => { if (o.tyyppi === 'kaava') kasittele(o, 'o', `${t.nimi} / ${o.nimi}`); });
    } else if (t.tyyppi === 'kaava') kasittele(t, 't', t.nimi);
  }
  return { rivit, virheet };
}

async function tallenna() {
  const virheet = tarkistaRajat();
  const aikaparit = tarkistaAikaparit();
  virheet.push(...aikaparit.virheet);
  if (virheet.length) {
    const el = document.getElementById("virhe");
    el.textContent = "Tarkista pisteet ja täytä uudelleen: " + virheet.join("; ");
    el.style.display = "flex";
    return;
  }
  if (aikaparit.rivit.length && !confirm(`Tarkista kellonajat ennen tallennusta:\n\n${aikaparit.rivit.join("\n\n")}\n\nOvatko ajat oikein?`)) return;
  const btn = document.getElementById("tallenna-btn");
  btn.disabled = true; btn.textContent = "Tallennetaan...";
  document.getElementById("virhe").style.display = "none";
  const nyt = new Date().toLocaleString("fi-FI");

  const tallennaTulos = async (data) => {
    const res = await fetch("/api/tulos", { method:"POST", headers:{"Content-Type":"application/json", ...adminOtsikot}, body: JSON.stringify(data) });
    if (!res.ok) { const e = await res.json().catch(() => ({})); throw new Error(e.detail || res.status); }
  };

  try {
    for (const t of tehtavat) {
      if (t.osatehtavat && t.osatehtavat.length > 0) {
        for (const o of t.osatehtavat) {
          const s = getOsaScore(o);
          if (s.pisteet !== null || s.oikein !== null || s.aika_sekuntia !== null || s.syotteet !== null) {
            await tallennaTulos({suoritus_id:suoritusId, osatehtava_id:o.id, ...s, token, aika:nyt});
          }
        }
      } else {
        const s = getTehtavaScore(t);
        if (s.pisteet !== null || s.oikein !== null || s.aika_sekuntia !== null || s.syotteet !== null) {
          await tallennaTulos({suoritus_id:suoritusId, tehtava_id:t.id, ...s, token, aika:nyt});
        }
      }
    }

    const kommentti = document.getElementById("kommentti").value.trim() || null;
    const kRes = await fetch(`/api/suoritus/${suoritusId}`, { method:"PUT", headers:{"Content-Type":"application/json", ...adminOtsikot},
      body: JSON.stringify({kommentti, token}) });
    if (!kRes.ok) { const e = await kRes.json().catch(() => ({})); throw new Error(e.detail || kRes.status); }

    document.getElementById("ok-viesti").style.display = "flex";
    setTimeout(() => takaisin(), 1200);
  } catch(e) {
    const el = document.getElementById("virhe");
    el.textContent = "Virhe tallennuksessa: " + e.message;
    el.style.display = "flex";
  } finally {
    btn.disabled = false; btn.textContent = "Tallenna pisteet";
  }
}

// Hiiren rulla ei saa muuttaa aktiivisen aika- tai numerokentän arvoa vahingossa (selain muuttaa sitä rullatessa)
document.addEventListener("wheel", e => {
  if (e.target.matches?.('input[type=time], input[type=number]') && document.activeElement === e.target) e.target.blur();
}, { passive: true });

async function init() {
  const lataus = document.getElementById("lataus");
  try {
    const [rastiRes, suoritusRes, tehtavatRes] = await Promise.all([
      fetch("/api/rastit"),
      fetch(`/api/suoritus?vartio=${encodeURIComponent(vartio)}&rasti_id=${rastiId}&token=${encodeURIComponent(token)}`, { headers: adminOtsikot }),
      fetch(`/api/tehtavat?rasti_id=${rastiId}`),
      haeAjastin()
    ]);

    if (suoritusRes.status === 401) {
      if (adminMode) { localStorage.removeItem("admin_token"); window.location.href = "/admin.html"; }
      else { localStorage.clear(); window.location.href = "/"; }
      return;
    }
    if (!suoritusRes.ok) throw new Error("Virhe suorituksen latauksessa");

    const rastit = await rastiRes.json();
    const rasti = rastit.find(r => r.id === rastiId);
    if (rasti) document.getElementById("otsikko").textContent = `Rasti ${rasti.numero} — Pisteet`;

    const suoritus = await suoritusRes.json();
    suoritusId = suoritus.id;
    tehtavat = await tehtavatRes.json();

    lataus.style.display = "none";

    if (!tehtavat.length) {
      lataus.textContent = "Tällä rastilla ei ole tehtäviä.";
      lataus.style.display = "flex";
      return;
    }

    document.getElementById("tehtavat-lista").style.display = "block";
    renderTehtavat(tehtavat, suoritus);

    document.getElementById("kommentti-osio").style.display = "block";
    if (suoritus.kommentti) document.getElementById("kommentti").value = suoritus.kommentti;

    document.getElementById("tallenna-btn").style.display = "block";
  } catch(e) {
    lataus.className = "msg msg-error";
    lataus.textContent = "Virhe: " + e.message;
  }
}

init();
</script>
