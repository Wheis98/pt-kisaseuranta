<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kipa</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="header">
  <div class="header-left">
    <span class="header-title">Kipa</span>
    <span class="header-sub">Kisaseuranta</span>
  </div>
</div>

<div class="container">
  <div class="card" style="margin-top:32px">
    <div class="card-title">Kirjaudu sisään</div>

    <div id="virhe" class="msg msg-error" style="display:none"></div>

    <div class="field">
      <label for="nimi">Nimi</label>
      <input type="text" id="nimi" placeholder="Etunimi Sukunimi" autocomplete="name">
    </div>

    <button class="btn btn-primary btn-block" id="btn" onclick="tallenna()">Jatka →</button>
  </div>

  <div class="link-group">
    <a class="nav-link" href="admin.html">Admin-hallinta</a>
  </div>
</div>

<script>
async function tallenna() {
  const nimi = document.getElementById("nimi").value.trim();
  const virhe = document.getElementById("virhe");
  const btn = document.getElementById("btn");
  virhe.style.display = "none";
  if (!nimi) { virhe.textContent = "Syötä nimi."; virhe.style.display = "flex"; return; }
  btn.disabled = true; btn.textContent = "Tallennetaan…";
  try {
    const res = await fetch("/api/user", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ nimi }),
    });
    if (!res.ok) { const e = await res.json(); throw new Error(e.detail); }
    const data = await res.json();
    localStorage.setItem("token", data.token);
    localStorage.setItem("nimi", data.nimi);
    window.location.href = "rasti.html";
  } catch(e) {
    virhe.textContent = e.message; virhe.style.display = "flex";
    btn.disabled = false; btn.textContent = "Jatka →";
  }
}
document.addEventListener("keydown", e => { if (e.key === "Enter") tallenna(); });
</script>
</body>
</html>
