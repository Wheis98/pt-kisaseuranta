<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kipa — Leimaukset</title>
  <style>
    body { font-family: sans-serif; max-width: 900px; margin: 40px auto; padding: 0 16px; }
    h2 { margin-bottom: 8px; }
    .toolbar { display: flex; gap: 8px; margin-bottom: 16px; align-items: center; }
    .toolbar button { padding: 8px 16px; font-size: 0.95rem; border: 1px solid #ccc; border-radius: 4px; cursor: pointer; background: white; }
    .toolbar button:hover { background: #f3f4f6; }
    #export-btn { background: #2563eb; color: white; border-color: #2563eb; }
    #export-btn:hover { background: #1d4ed8; }
    #count { color: #555; font-size: 0.9rem; }
    table { width: 100%; border-collapse: collapse; font-size: 0.95rem; }
    th { text-align: left; padding: 10px 8px; border-bottom: 2px solid #e5e7eb; background: #f9fafb; }
    td { padding: 10px 8px; border-bottom: 1px solid #e5e7eb; }
    tr:hover td { background: #f9fafb; }
    #tila { color: #555; margin-top: 24px; }
    a.linkki { display: inline-block; margin-top: 24px; color: #2563eb; }
  </style>
</head>
<body>

<h2>Kaikki leimaukset</h2>

<div class="toolbar">
  <button onclick="lataa()">Päivitä</button>
  <button id="export-btn" onclick="exportCSV()">Lataa CSV</button>
  <span id="count"></span>
</div>

<table>
  <thead>
    <tr>
      <th>Käyttäjä</th>
      <th>Rasti</th>
      <th>Vartio</th>
      <th>Jäsenet</th>
      <th>Aika</th>
    </tr>
  </thead>
  <tbody id="tbody"></tbody>
</table>

<div id="tila"></div>
<a class="linkki" href="leimaus.html">← Takaisin leimaukseen</a>

<script>
let rivit = [];

async function lataa() {
  document.getElementById("tila").textContent = "Ladataan…";
  try {
    const res = await fetch("/api/data");
    if (!res.ok) throw new Error("Palvelinvirhe " + res.status);
    rivit = await res.json();
    renderTable(rivit);
    document.getElementById("tila").textContent = "";
  } catch (e) {
    document.getElementById("tila").textContent = "Virhe: " + e.message;
  }
}

function renderTable(data) {
  const tbody = document.getElementById("tbody");
  tbody.innerHTML = "";
  data.forEach(r => {
    const tr = document.createElement("tr");
    ["kayttaja", "numero", "vartio", "jasenet", "aika"].forEach(k => {
      const td = document.createElement("td");
      td.textContent = r[k];
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
  document.getElementById("count").textContent = data.length + " leimaus" + (data.length !== 1 ? "ta" : "");
}

function exportCSV() {
  if (!rivit.length) { alert("Ei dataa vietäväksi."); return; }
  const header = ["Käyttäjä", "Rasti", "Vartio", "Jäsenet", "Aika"];
  const rows = rivit.map(r =>
    [r.kayttaja, r.numero, r.vartio, r.jasenet, r.aika]
      .map(v => `"${String(v).replace(/"/g, '""')}"`)
      .join(",")
  );
  const csv = [header.join(","), ...rows].join("\n");
  const blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "leimaukset.csv";
  a.click();
  URL.revokeObjectURL(url);
}

lataa();
</script>

</body>
</html>
