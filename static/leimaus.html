<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kipa — Leimaus</title>
  <link rel="stylesheet" href="/style.css">
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    #reader video { border-radius: 8px; }
    #reader { margin-bottom: 16px; }
  </style>
</head>
<body>
<div class="header">
  <div class="header-left">
    <span class="header-title" id="rasti-otsikko"></span>
    <span class="header-sub" id="kayttaja-info"></span>
  </div>
  <div class="header-right">
    <a href="tilanne.html" class="btn btn-white btn-sm">Tilanne</a>
    <a href="rasti.html" class="btn btn-white btn-sm">Vaihda</a>
  </div>
</div>

<div class="container">

  <!-- Tulossa pian -->
  <div id="tulossa-osio" class="alert-orange" style="display:none">
    <div class="alert-orange-title">⚡ Tulossa pian</div>
    <div id="tulossa-lista"></div>
  </div>

  <!-- Rastilla nyt -->
  <div class="card">
    <div class="card-title">Rastilla nyt</div>
    <div id="aktiiviset-lista"></div>
    <div id="ei-aktiivisia" class="msg msg-ok" style="display:none">Ei aktiivisia vartioita</div>
  </div>

  <!-- Leimaa sisään -->
  <div class="card">
    <div class="card-title">Leimaa sisään</div>

    <div class="toggle-group" style="margin-bottom:16px">
      <button class="toggle-btn" id="qr-btn" onclick="avaaQR()">📷 QR-koodi</button>
      <button class="toggle-btn" id="man-btn" onclick="manuaalinen()">✏️ Manuaalinen</button>
    </div>

    <div id="reader"></div>

    <div class="field ac-wrap">
      <label for="vartio">Vartion nimi</label>
      <input type="text" id="vartio" placeholder="Kirjoita vartion nimi..." autocomplete="off">
      <div id="ac-lista" class="ac-list" style="display:none"></div>
    </div>

    <div class="field">
      <label for="jasenet">Jäsenten määrä</label>
      <input type="number" id="jasenet" placeholder="0" min="0" inputmode="numeric">
    </div>

    <div class="field">
      <label for="aika">Aikaleima</label>
      <input type="text" id="aika" readonly>
    </div>

    <div id="viesti" style="display:none" class="msg"></div>

    <button class="btn btn-success btn-block" id="tallenna-btn" onclick="tallennaLeimaus()">Tallenna leimaus</button>
  </div>

  <div class="link-group">
    <a class="nav-link" href="data.html">Katso kaikki leimaukset</a>
  </div>
</div>

<script>
const token = localStorage.getItem("token");
const nimi = localStorage.getItem("nimi");
const rastinumero = localStorage.getItem("rastinumero");
if (!token) window.location.href = "/";
if (!rastinumero) window.location.href = "/rasti.html";

document.getElementById("rasti-otsikko").textContent = "Rasti " + rastinumero;
document.getElementById("kayttaja-info").textContent = nimi;

let qrScanner = null;
let vartioData = [];
let acValittu = -1;

function aikaleima() { return new Date().toLocaleString("fi-FI"); }

function setViesti(teksti, tyyppi) {
  const el = document.getElementById("viesti");
  if (!teksti) { el.style.display = "none"; return; }
  el.textContent = teksti;
  el.className = "msg " + (tyyppi === "ok" ? "msg-ok" : "msg-error");
  el.style.display = "flex";
}

// ── Autocomplete ──
async function lataaVartiot() {
  const res = await fetch("/api/vartiot");
  vartioData = await res.json();
}
function valitseVartio(v) {
  document.getElementById("vartio").value = v.nimi;
  document.getElementById("jasenet").value = v.jasenet;
  document.getElementById("aika").value = aikaleima();
  suljeAC();
}
function suljeAC() { document.getElementById("ac-lista").style.display = "none"; acValittu = -1; }
function naytaAC(haku) {
  const lista = document.getElementById("ac-lista");
  if (!haku) { suljeAC(); return; }
  const osumat = vartioData.filter(v => v.nimi.toLowerCase().includes(haku.toLowerCase()));
  if (!osumat.length) { suljeAC(); return; }
  lista.innerHTML = ""; acValittu = -1;
  osumat.forEach((v, i) => {
    const div = document.createElement("div");
    div.dataset.idx = i;
    div.innerHTML = `<span>${v.nimi}</span><span class="ac-sub">${v.jasenet} jäsentä</span>`;
    div.addEventListener("mousedown", e => { e.preventDefault(); valitseVartio(v); });
    lista.appendChild(div);
  });
  lista.style.display = "block";
}
document.getElementById("vartio").addEventListener("input", e => naytaAC(e.target.value));
document.getElementById("vartio").addEventListener("blur", () => setTimeout(suljeAC, 150));
document.getElementById("vartio").addEventListener("keydown", e => {
  const rivit = document.getElementById("ac-lista").querySelectorAll("div");
  if (!rivit.length) return;
  if (e.key === "ArrowDown") { e.preventDefault(); acValittu = Math.min(acValittu+1, rivit.length-1); rivit.forEach((r,i) => r.classList.toggle("active", i===acValittu)); }
  else if (e.key === "ArrowUp") { e.preventDefault(); acValittu = Math.max(acValittu-1, 0); rivit.forEach((r,i) => r.classList.toggle("active", i===acValittu)); }
  else if (e.key === "Enter" && acValittu >= 0) { e.preventDefault(); const haku = document.getElementById("vartio").value; const osumat = vartioData.filter(v => v.nimi.toLowerCase().includes(haku.toLowerCase())); if (osumat[acValittu]) valitseVartio(osumat[acValittu]); }
  else if (e.key === "Escape") suljeAC();
});

// ── Aktiiviset ──
async function paivitaAktiiviset() {
  const res = await fetch("/api/aktiiviset?numero=" + encodeURIComponent(rastinumero));
  if (!res.ok) return;
  const lista = await res.json();
  const div = document.getElementById("aktiiviset-lista");
  const eiDiv = document.getElementById("ei-aktiivisia");
  div.innerHTML = "";
  if (!lista.length) { eiDiv.style.display = "flex"; return; }
  eiDiv.style.display = "none";
  lista.forEach(v => {
    const item = document.createElement("div");
    item.className = "active-item";
    item.innerHTML = `
      <div class="dot dot-green"></div>
      <div class="active-item-info">
        <div class="active-item-name">${v.vartio}</div>
        <div class="active-item-meta">${v.jasenet} jäsentä · ${v.aika}</div>
      </div>
      <button class="btn btn-danger btn-sm" onclick="leimaaUlos('${v.vartio.replace(/'/g,"\\'")}',${v.jasenet},this)">Ulos</button>
    `;
    div.appendChild(item);
  });
}

async function leimaaUlos(vartio, jasenet, btn) {
  btn.disabled = true; btn.textContent = "…";
  try {
    const res = await fetch("/api/leimaus", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ token, rastinumero, vartio, jasenet, aika: aikaleima(), tyyppi: "ulos" }),
    });
    if (!res.ok) { const e = await res.json(); if (res.status===401) { localStorage.clear(); window.location.href="/"; return; } throw new Error(e.detail); }
    await paivitaAktiiviset();
  } catch(e) { setViesti("Virhe: "+e.message, "error"); btn.disabled=false; btn.textContent="Ulos"; }
}

// ── QR ──
function manuaalinen() {
  if (qrScanner) { qrScanner.stop().catch(()=>{}); qrScanner=null; }
  document.getElementById("reader").innerHTML = "";
  document.getElementById("vartio").value = "";
  document.getElementById("jasenet").value = "";
  document.getElementById("aika").value = aikaleima();
  document.getElementById("qr-btn").classList.remove("active");
  document.getElementById("man-btn").classList.add("active");
  document.getElementById("vartio").focus();
}

async function avaaQR() {
  document.getElementById("qr-btn").classList.add("active");
  document.getElementById("man-btn").classList.remove("active");
  if (qrScanner) return;
  qrScanner = new Html5Qrcode("reader");
  const kamerat = await Html5Qrcode.getCameras();
  const kameraId = kamerat.length > 1
    ? (kamerat.find(k => /back|rear|environment/i.test(k.label))?.id ?? kamerat[kamerat.length-1].id)
    : kamerat[0]?.id;
  qrScanner.start(
    kameraId || { facingMode: "environment" }, { fps: 10, qrbox: 250 },
    async (text) => {
      qrScanner.stop().then(() => { qrScanner = null; });
      const res = await fetch("/api/vartio/" + encodeURIComponent(text));
      if (res.ok) { const v = await res.json(); document.getElementById("vartio").value = v.nimi; document.getElementById("jasenet").value = v.jasenet; }
      else { setViesti("QR-koodia ei tunnistettu.", "error"); return; }
      document.getElementById("aika").value = aikaleima();
      document.getElementById("qr-btn").classList.remove("active");
    }
  ).catch(err => { setViesti("QR-virhe: "+err, "error"); qrScanner=null; });
}

// ── Tallenna ──
async function tallennaLeimaus() {
  const vartio = document.getElementById("vartio").value.trim();
  const jasetVal = document.getElementById("jasenet").value;
  const jasenet = parseInt(jasetVal);
  const aika = document.getElementById("aika").value || aikaleima();
  setViesti("", "");
  if (!vartio) { setViesti("Syötä vartion nimi.", "error"); return; }
  if (jasetVal==="" || isNaN(jasenet) || jasenet<0) { setViesti("Syötä jäsenten määrä.", "error"); return; }
  const btn = document.getElementById("tallenna-btn");
  btn.disabled=true; btn.textContent="Tallennetaan…";
  try {
    const res = await fetch("/api/leimaus", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ token, rastinumero, vartio, jasenet, aika, tyyppi: "sisaan" }),
    });
    if (!res.ok) { const e = await res.json(); if (res.status===401) { localStorage.clear(); window.location.href="/"; return; } throw new Error(e.detail); }
    setViesti("Tallennettu!", "ok");
    document.getElementById("vartio").value = "";
    document.getElementById("jasenet").value = "";
    document.getElementById("aika").value = "";
    document.getElementById("man-btn").classList.remove("active");
    document.getElementById("qr-btn").classList.remove("active");
    await paivitaAktiiviset();
  } catch(e) { setViesti("Virhe: "+e.message, "error"); }
  finally { btn.disabled=false; btn.textContent="Tallenna leimaus"; }
}

// ── Tulossa pian ──
async function paivitaTulossa() {
  const res = await fetch("/api/tilanne?numero=" + encodeURIComponent(rastinumero));
  if (!res.ok) return;
  const vartiot = await res.json();
  const nyt = new Date();
  const tulossa = vartiot.filter(v => {
    if (v.status !== "tulossa" || !v.arvioitu_saapuminen) return false;
    const [h,m] = v.arvioitu_saapuminen.split(":").map(Number);
    const s = new Date(); s.setHours(h,m,0,0);
    return (s-nyt)/60000 <= 5;
  });
  const osio = document.getElementById("tulossa-osio");
  const lista = document.getElementById("tulossa-lista");
  if (!tulossa.length) { osio.style.display="none"; return; }
  lista.innerHTML = "";
  tulossa.forEach(v => {
    const [h,m] = v.arvioitu_saapuminen.split(":").map(Number);
    const s = new Date(); s.setHours(h,m,0,0);
    const diff = Math.round((s-new Date())/60000);
    const aikaStr = diff<=0 ? "nyt" : diff+" min";
    const div = document.createElement("div");
    div.className = "alert-item";
    div.innerHTML = `<span><strong>${v.nimi}</strong> <span style="color:var(--muted);font-size:.85rem">(${v.jasenet} jäs.)</span></span><span class="alert-item-time">~${aikaStr}</span>`;
    lista.appendChild(div);
  });
  osio.style.display = "block";
}

paivitaAktiiviset();
paivitaTulossa();
lataaVartiot();
setInterval(() => { paivitaAktiiviset(); paivitaTulossa(); }, 30000);
</script>
</body>
</html>
